<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- =========================
         BASIC
    ========================== -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#6300ff" />

    <title>Zelt — Atendimento inteligente para empresas</title>

    <meta
      name="description"
      content="Automatize o atendimento da sua empresa com o Zelt. Inteligência artificial para WhatsApp, clientes, pedidos e operações."
    />

    <meta name="robots" content="index, follow" />

    <meta name="author" content="Zelt" />

    <link rel="canonical" href="https://zelt-ai.vercel.app/" />


    <!-- =========================
         FAVICON
    ========================== -->

    <link rel="icon" type="image/png" href="/icon.png" />

    <link
      rel="apple-touch-icon"
      href="/icon.png"
    />


    <!-- =========================
         OPEN GRAPH
         WhatsApp / Facebook /
         Discord / Telegram etc.
    ========================== -->

    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://zelt-ai.vercel.app"
    />

    <meta
      property="og:site_name"
      content="Zelt"
    />

    <meta
      property="og:locale"
      content="pt_BR"
    />

    <meta
      property="og:title"
      content="Zelt — Atendimento inteligente para empresas"
    />

    <meta
      property="og:description"
      content="Automatize o atendimento da sua empresa com inteligência artificial."
    />

    <meta
      property="og:image"
      content="https://zelt-ai.vercel.app/og-banner.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Zelt — Atendimento inteligente para empresas"
    />


    <!-- =========================
         X / TWITTER
    ========================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Zelt — Atendimento inteligente para empresas"
    />

    <meta
      name="twitter:description"
      content="Automatize o atendimento da sua empresa com inteligência artificial."
    />

    <meta
      name="twitter:image"
      content="https://zelt-ai.vercel.app/og-banner.png"
    />

    <meta
      name="twitter:image:alt"
      content="Zelt — Atendimento inteligente para empresas"
    />


    <!-- =========================
         PWA
    ========================== -->

    <link
      rel="manifest"
      href="/manifest.webmanifest"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Zelt"
    />


    <!-- =========================
         PERFORMANCE
    ========================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="dns-prefetch"
      href="//fonts.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="//fonts.gstatic.com"
    />


    <!-- =========================
         FONT
    ========================== -->

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />


    <!-- =========================
         GLOBAL STYLE
    ========================== -->

    <style>
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      html {
        background: #ffffff;
        scroll-behavior: smooth;
      }

      body {
        font-family:
          'DM Sans',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;

        background: #ffffff;
        color: #111111;

        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;

        text-rendering: optimizeLegibility;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      img,
      svg {
        max-width: 100%;
      }
    </style>
  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
